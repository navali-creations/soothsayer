name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "!.changeset/**"
      - ".env.example"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "!.changeset/**"
      - ".env.example"
      - "LICENSE"
      - ".gitignore"

# Cancel in-progress runs for the same branch/PR.  When a dependabot PR is
# rebased after merging a sibling, the previous (now stale) run is cancelled
# instead of burning through minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  NODE_MODULES_CACHE_VERSION: electron-bin-v1

jobs:
  install:
    name: Install Dependencies
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary
        run: |
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron

  lint:
    name: Lint
    needs: [install]
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Run Biome checks
        run: pnpm check

  typecheck:
    name: Typecheck
    needs: [install]
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Run type checks
        run: pnpm typecheck

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    outputs:
      app-code: ${{ steps.filter.outputs.app-code }}
      supabase-db: ${{ steps.filter.outputs.supabase-db }}
      supabase-edge: ${{ steps.filter.outputs.supabase-edge }}
      dep-supabase: ${{ steps.deps.outputs.supabase }}
      dep-kysely: ${{ steps.deps.outputs.kysely }}
      dep-better-sqlite3: ${{ steps.deps.outputs.better-sqlite3 }}
      dep-electron: ${{ steps.deps.outputs.electron }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app-code:
              - 'main/**'
              - 'renderer/**'
              - 'vitest.*.config.*'
            supabase-db:
              - 'supabase/migrations/**'
              - 'supabase/tests/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
            supabase-edge:
              - 'supabase/functions/**'

      - name: Detect dependency updates
        id: deps
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"

          if echo "$BRANCH" | grep -qi 'supabase'; then
            echo "supabase=true" >> $GITHUB_OUTPUT
          else
            echo "supabase=false" >> $GITHUB_OUTPUT
          fi

          if echo "$BRANCH" | grep -qi 'kysely'; then
            echo "kysely=true" >> $GITHUB_OUTPUT
          else
            echo "kysely=false" >> $GITHUB_OUTPUT
          fi

          if echo "$BRANCH" | grep -qi 'better-sqlite3'; then
            echo "better-sqlite3=true" >> $GITHUB_OUTPUT
          else
            echo "better-sqlite3=false" >> $GITHUB_OUTPUT
          fi

          if echo "$BRANCH" | grep -qi 'electron'; then
            echo "electron=true" >> $GITHUB_OUTPUT
          else
            echo "electron=false" >> $GITHUB_OUTPUT
          fi

  test-unit:
    name: Unit Tests (${{ matrix.suite }})
    needs: [install, lint, typecheck, changes]
    if: >-
      always() &&
      !contains(github.event.head_commit.message, '[ci] release') &&
      needs.install.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      (
        needs.changes.outputs.app-code == 'true' ||
        needs.changes.outputs.dep-supabase == 'true' ||
        needs.changes.outputs.dep-kysely == 'true' ||
        needs.changes.outputs.dep-better-sqlite3 == 'true' ||
        needs.changes.outputs.dep-electron == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite:
          - main
          - renderer
        include:
          - suite: main
            command: node scripts/vitest-electron.mjs run --config vitest.main.config.mts
          - suite: renderer
            command: ./node_modules/.bin/vitest run --config vitest.renderer.config.mts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Rebuild Electron binary
        if: matrix.suite == 'main'
        run: pnpm rebuild electron

      - name: Run ${{ matrix.suite }} tests
        run: ${{ matrix.command }}

  test-edge:
    name: Edge Function Tests (Deno)
    needs: [lint, typecheck, changes]
    if: >-
      always() &&
      !contains(github.event.head_commit.message, '[ci] release') &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      (
        needs.changes.outputs.supabase-edge == 'true' ||
        needs.changes.outputs.dep-supabase == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run edge function tests
        run: deno test --allow-all --config supabase/functions/deno.json supabase/functions/tests/

  test-db:
    name: Database Tests (pgTAP)
    needs: [install, lint, typecheck, changes]
    if: >-
      always() &&
      !contains(github.event.head_commit.message, '[ci] release') &&
      needs.install.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      (
        needs.changes.outputs.supabase-db == 'true' ||
        needs.changes.outputs.dep-supabase == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Start Supabase (DB only)
        run: pnpx supabase start -x gotrue,realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,inbucket,pg_meta

      - name: Run database tests
        run: pnpx supabase test db

      - name: Stop Supabase
        if: always()
        run: pnpx supabase stop --no-backup

  rust-helper:
    name: Rust Process Helper (${{ matrix.os }})
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Check helper formatting
        run: node scripts/run-msvc-cargo.mjs fmt --manifest-path helpers/poe-process-helper/Cargo.toml --check

      - name: Lint helper
        run: node scripts/run-msvc-cargo.mjs clippy --manifest-path helpers/poe-process-helper/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test helper
        run: node scripts/run-msvc-cargo.mjs test --manifest-path helpers/poe-process-helper/Cargo.toml --locked

      - name: Smoke test helper protocol
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $output = node scripts/run-msvc-cargo.mjs run --quiet --manifest-path helpers/poe-process-helper/Cargo.toml --locked -- --once --title "Soothsayer PoE Process Watcher"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $output | Select-Object -Last 1 | node scripts/validate-poe-process-helper-payload.mjs

      - name: Smoke test helper protocol
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output=$(node scripts/run-msvc-cargo.mjs run --quiet --manifest-path helpers/poe-process-helper/Cargo.toml --locked -- --once --title "Soothsayer PoE Process Watcher")
          printf '%s\n' "$output" | node scripts/validate-poe-process-helper-payload.mjs

  build:
    name: Build Check
    needs: [install, lint, typecheck]
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Package app (dry run)
        run: pnpm package

  smoke-test:
    name: Startup Smoke Test
    needs: [install, lint, typecheck]
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Package app
        run: pnpm package

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Launch packaged binary
        run: |
          BINARY="out/Soothsayer-linux-x64/soothsayer"
          if [ ! -f "$BINARY" ]; then
            echo "::error::Packaged binary not found at $BINARY"
            exit 1
          fi

          # Launch the app under Xvfb and capture all output.  Instead of a
          # fixed sleep we poll the log for one of two signals:
          #   ✓ "[Init] All services initialized successfully" — app booted
          #   ✗ "Uncaught Exception" — main process crashed
          # A 60 s timeout acts as a safety net for unexpectedly slow runners.
          LOG=$(mktemp)
          xvfb-run --auto-servernum "$BINARY" --no-sandbox >"$LOG" 2>&1 &
          PID=$!
          echo "Launched packaged app (PID $PID), polling for startup result…"

          TIMEOUT=60
          ELAPSED=0
          RESULT=""
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            if grep -q "Uncaught Exception" "$LOG" 2>/dev/null; then
              RESULT="crash"
              break
            fi
            if grep -q "All services initialized successfully" "$LOG" 2>/dev/null; then
              RESULT="ok"
              break
            fi
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done

          # Dump raw output for CI visibility
          echo "── App output ──"
          cat "$LOG"
          echo "────────────────"

          # Clean up the app process regardless of outcome
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          # ── Build results table ──────────────────────────────────────
          # Check each expected signal in the log and build an ASCII table
          # for the console log, a markdown table for the GitHub Job Summary,
          # and per-check annotations for the GitHub Annotations section.
          FAILED=0
          SUMMARY_FILE=$(mktemp)

          W=46

          # Start the markdown summary table
          echo "### 🔥 Startup Smoke Test Results (${ELAPSED}s)" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "| Status | Check |" >> "$SUMMARY_FILE"
          echo "|--------|-------|" >> "$SUMMARY_FILE"

          check() {
            local label="$1"
            local pattern="$2"
            if grep -q "$pattern" "$LOG" 2>/dev/null; then
              printf "│ ✅  │ %-${W}s │\n" "$label"
              echo "| ✅ | $label |" >> "$SUMMARY_FILE"
            else
              printf "│ ❌  │ %-${W}s │\n" "$label"
              echo "| ❌ | $label |" >> "$SUMMARY_FILE"
              echo "::error::Smoke Test: $label — FAILED"
              FAILED=$((FAILED + 1))
            fi
          }

          echo ""
          echo "┌──────┬────────────────────────────────────────────────┐"
          printf "│      │ %-${W}s │\n" "Smoke Test Results (${ELAPSED}s)"
          echo "├──────┼────────────────────────────────────────────────┤"

          check "No uncaught exceptions"          "All services initialized successfully"
          check "Migrations completed"            "All migrations completed successfully"
          check "Settings"                        "\[Init\] ✓ Settings"
          check "Database"                        "\[Init\] ✓ Database"
          check "Supabase"                        "\[Init\] .* Supabase"
          check "POE Leagues"                     "\[Init\] ✓ POE Leagues"
          check "Divination Cards"                "\[Init\] ✓ Divination Cards"
          check "Card Details"                    "\[Init\] ✓ Card Details"
          check "Snapshots"                       "\[Init\] ✓ Snapshots"
          check "Sessions"                        "\[Init\] ✓ Sessions"
          check "Analytics"                       "\[Init\] ✓ Analytics"
          check "CSV"                             "\[Init\] ✓ CSV"
          check "Overlay"                         "\[Init\] ✓ Overlay"
          check "Client Log Reader"               "\[Init\] ✓ Client Log Reader"
          check "All services initialized"        "All services initialized successfully"

          echo "├──────┼────────────────────────────────────────────────┤"

          # Check for individual migration failures
          if grep -q "\[Migrations\] ✗ Failed" "$LOG" 2>/dev/null; then
            printf "│ ❌  │ %-${W}s │\n" "Some migrations failed:"
            grep "\[Migrations\] ✗" "$LOG" | while read -r line; do
              printf "│      │   %-$((W - 2))s │\n" "$line"
            done
            echo "| ❌ | Some migrations failed |" >> "$SUMMARY_FILE"
            echo "::error::Smoke Test: Some migrations failed — see log for details"
            FAILED=$((FAILED + 1))
          else
            printf "│ ✅  │ %-${W}s │\n" "No individual migration failures"
            echo "| ✅ | No individual migration failures |" >> "$SUMMARY_FILE"
          fi

          echo "└──────┴────────────────────────────────────────────────┘"
          echo ""

          # Write the markdown summary to the GitHub Job Summary
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$LOG" "$SUMMARY_FILE"

          # ── Final verdict ────────────────────────────────────────────
          case "$RESULT" in
            crash)
              echo "::error::Packaged app crashed during startup — see output above"
              exit 1
              ;;
            "")
              echo "::error::App did not produce a startup signal within ${TIMEOUT} s — see output above"
              exit 1
              ;;
          esac

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} smoke test check(s) failed — see table above"
            exit 1
          fi

          echo "✓ All smoke test checks passed (${ELAPSED} s)"

  e2e:
    name: Electron E2E Tests
    needs: [install, smoke-test]
    if: "!contains(github.event.head_commit.message, '[ci] release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ env.NODE_MODULES_CACHE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Ensure Electron binary
        run: |
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64

      - name: Build Electron main + preload for E2E
        run: node scripts/build-e2e.mjs

      - name: Run E2E tests
        env:
          E2E_TESTING: "true"
        run: |
          # Start Xvfb on a free display, suppress xkbcomp keysym warnings
          export DISPLAY=:99
          Xvfb $DISPLAY -screen 0 1920x1080x24 2>/dev/null &
          # Wait for the X server socket to appear instead of a fixed sleep
          timeout 5 bash -c 'until [ -e /tmp/.X11-unix/X99 ]; do sleep 0.1; done'
          # A lightweight window manager is required so that Electron's
          # minimize()/maximize() X11 hints are actually processed.
          # Pre-seed a minimal config to suppress "Failed to read" warnings.
          mkdir -p ~/.fluxbox
          echo "session.screen0.workspaces: 1" > ~/.fluxbox/init
          fluxbox 2>/dev/null &
          pnpm exec playwright test --config playwright.config.ts
